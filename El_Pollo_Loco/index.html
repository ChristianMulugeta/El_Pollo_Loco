<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/6_salsa_bottle/2_salsa_bottle_on_ground.png">
    <title>El Pollo Loco</title>
    <script src="classes/drawable-object.class.js"></script>
    <script src="classes/movable-object.class.js"></script>
    <script src="classes/character.class.js"></script>
    <script src="classes/chicken.class.js"></script>
    <script src="classes/throwable-object.class.js"></script>
    <script src="classes/cloud.class.js"></script>
    <script src="classes/status-bar.class.js"></script>
    <script src="classes/world.class.js"></script>
    <script src="classes/background-object.class.js"></script>
    <script src="classes/keyboard.class.js"></script>
    <script src="classes/level.class.js"></script>
    <script src="classes/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="script.js"></script>

</head>

<body>
    <h1>El Pollo Loco</h1>
    <main class="game-container">
        <canvas id="canvas" width="720" height="480">
            Your browser does not support the canvas element.
        </canvas>
        <section id="start-screen" class="start-screen">
            <div class="start-actions">
                <button class="game-button" type="button" onclick="startGame()">Start Game</button>
                <button class="game-button" type="button" onclick="showControls()">Controls</button>
            </div>
        </section>
        <dialog id="controls-dialog" class="controls-dialog" onclick="closeControlsOnBackdrop(event)">
            <h2>Controls</h2>
            <p><span>Move</span> Arrow keys or A / D</p>
            <p><span>Jump</span> Space</p>
            <p><span>Throw bottle</span> R</p>
            <button class="game-button" type="button" onclick="closeControls()">Close</button>
        </dialog>
    </main>
</body>
</html>
