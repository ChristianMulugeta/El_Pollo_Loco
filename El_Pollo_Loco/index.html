<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/6_salsa_bottle/2_salsa_bottle_on_ground.png">
    <title>El Pollo Loco</title>
    <script src="classes/drawable-object.class.js"></script>
    <script src="classes/movable-object.class.js"></script>
    <script src="classes/coin.class.js"></script>
    <script src="classes/bottle.class.js"></script>
    <script src="classes/character.class.js"></script>
    <script src="classes/chicken.class.js"></script>
    <script src="classes/small-chicken.class.js"></script>
    <script src="classes/throwable-object.class.js"></script>
    <script src="classes/cloud.class.js"></script>
    <script src="classes/status-bar.class.js"></script>
    <script src="classes/coin-status-bar.class.js"></script>
    <script src="classes/bottle-status-bar.class.js"></script>
    <script src="classes/endboss-status-bar.class.js"></script>
    <script src="classes/world.class.js"></script>
    <script src="classes/background-object.class.js"></script>
    <script src="classes/keyboard.class.js"></script>
    <script src="classes/audio-manager.class.js"></script>
    <script src="classes/level.class.js"></script>
    <script src="classes/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="script.js"></script>

</head>

<body>
    <h1>El Pollo Loco</h1>
    <main class="game-container">
        <canvas id="canvas" width="720" height="480">
            Your browser does not support the canvas element.
        </canvas>
        <button id="mute-button" class="mute-button" type="button"
            onclick="toggleMute()" aria-pressed="false" aria-label="Mute sound"
            title="Mute sound">&#128266;</button>
        <button id="settings-button" class="settings-button hidden" type="button"
            onclick="pauseGame()" aria-label="Pause game" title="Pause game">
            <span></span><span></span><span></span>
        </button>
        <section id="start-screen" class="start-screen">
            <div class="start-actions">
                <button class="game-button" type="button" onclick="startGame()">Start Game</button>
                <button class="game-button" type="button" onclick="showControls()">Controls</button>
            </div>
            <footer class="site-footer">
                <a class="game-button" href="imprint.html">Legal Notice</a>
            </footer>
        </section>
        <section id="end-screen" class="end-screen hidden">
            <img id="result-image" class="result-image" alt="">
            <div class="end-actions">
                <button class="game-button" type="button" onclick="restartGame()">Play Again</button>
                <button class="game-button" type="button" onclick="returnHome()">Home</button>
            </div>
        </section>
        <section id="pause-screen" class="pause-screen hidden" aria-label="Pause menu">
            <h2>Paused</h2>
            <div class="pause-actions">
                <button class="game-button" type="button" onclick="resumeGame()">Resume</button>
                <button class="game-button" type="button" onclick="showControls()">Controls</button>
                <button class="game-button" type="button" onclick="giveUpGame()">Give Up</button>
            </div>
        </section>
        <nav class="touch-controls hidden" aria-label="Touch controls">
            <div class="touch-control-group">
                <button class="touch-button" type="button" data-key="LEFT"
                    aria-label="Move left">&#9664;</button>
                <button class="touch-button" type="button" data-key="RIGHT"
                    aria-label="Move right">&#9654;</button>
            </div>
            <div class="touch-control-group">
                <button class="touch-button touch-button--jump" type="button"
                    data-key="SPACE">Jump</button>
                <button class="touch-button touch-button--throw" type="button"
                    data-key="R" aria-label="Throw bottle"></button>
            </div>
        </nav>
        <section class="orientation-message" role="status">
            <span class="orientation-icon" aria-hidden="true">&#8635;</span>
            <p>Please rotate your device</p>
        </section>
        <dialog id="controls-dialog" class="controls-dialog" onclick="closeControlsOnBackdrop(event)">
            <h2>Controls</h2>
            <p><span>Move</span> Arrow keys or A / D</p>
            <p><span>Jump</span> Space</p>
            <p><span>Throw bottle</span> R</p>
            <button class="game-button" type="button" onclick="closeControls()">Close</button>
        </dialog>
    </main>
</body>
</html>
